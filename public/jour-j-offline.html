<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jour J (hors ligne) · Backstage</title>
  <style>
    :root { color-scheme: dark; --bg:#0e0e13; --card:#181820; --line:#2a2a36; --fg:#ececf1; --muted:#9a9aad; --accent:#f59e0b; --danger:#f87171; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 48rem; margin: 0 auto; display: grid; gap: 14px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: .9rem; }
    .top strong { color: var(--fg); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #3a2d10; color: var(--accent); font-size: .75rem; font-weight: 700; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 16px; text-align: center; }
    .cue { color: var(--accent); font-family: ui-monospace, monospace; font-size: .9rem; }
    h1 { margin: 8px 0; font-size: clamp(1.8rem, 6vw, 3rem); line-height: 1.15; }
    .notes { color: var(--muted); white-space: pre-line; font-size: 1.05rem; }
    .timer { font-family: ui-monospace, monospace; font-size: 2.6rem; font-weight: 700; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .timer.over { color: var(--danger); }
    .small { color: var(--muted); font-size: .8rem; }
    .row { display: flex; gap: 8px; }
    button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 12px; padding: 16px 18px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    #go { flex: 1; background: var(--accent); color: #14110a; border-color: var(--accent); font-size: 1.3rem; font-weight: 800; }
    #go:disabled { background: var(--card); color: var(--muted); border-color: var(--line); }
    #pause.on { background: var(--accent); color: #14110a; border-color: var(--accent); }
    .next { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: .9rem; }
    .next .n { color: var(--accent); font-family: ui-monospace, monospace; }
    ol { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); font-size: .9rem; }
    li { display: flex; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li .n { width: 2.6rem; color: var(--accent); font-family: ui-monospace, monospace; font-size: .8rem; }
    li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .c { color: var(--muted); font-size: .8rem; }
    li.cur { background: #3a2d10; font-weight: 600; }
    li.done { color: var(--muted); text-decoration: line-through; }
    .center { text-align: center; color: var(--muted); }
    a { color: var(--accent); }
    .pause-banner { display: none; margin: 0 auto 6px; width: fit-content; }
    .paused .pause-banner { display: block; }
  </style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var m = /\/projets\/(\d+)\/jour-j/.exec(location.pathname) || /[?&]p=(\d+)/.exec(location.search);
  var id = m ? m[1] : null;
  var DATA_KEY = "backstage:offline:jourj:" + id;
  var STATE_KEY = "backstage:show:" + id; // même clé que la page en ligne : l'état est partagé
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(DATA_KEY) || "null"); } catch (e) {}

  if (!id || !raw || !raw.cues || !raw.cues.length) {
    app.innerHTML = '<div class="card"><h1>Pas de données hors ligne</h1><p class="notes">Ouvre d\'abord ce Jour J avec du réseau : la conduite est alors enregistrée sur cet appareil pour la suite.</p><p><a href="/">Retour à Backstage</a></p></div>';
    return;
  }
  var cues = raw.cues;

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(STATE_KEY) || "null");
      if (s && s.index >= -1 && s.index < cues.length) return s;
    } catch (e) {}
    return { index: -1, cueStartedAt: null, showStartedAt: null, pausedAt: null };
  }
  function save(s) { try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {} render(); }
  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), mn = Math.floor((sec % 3600) / 60), ss = String(sec % 60).padStart(2, "0");
    return h > 0 ? h + ":" + String(mn).padStart(2, "0") + ":" + ss : mn + ":" + ss;
  }
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function go() {
    var s = load();
    if (s.index >= cues.length - 1 || s.pausedAt) return;
    var now = Date.now();
    save({ index: s.index + 1, cueStartedAt: now, showStartedAt: s.showStartedAt || now, pausedAt: null });
  }
  function back() {
    var s = load();
    if (s.index < 0 || s.pausedAt) return;
    save({ index: s.index - 1, cueStartedAt: Date.now(), showStartedAt: s.showStartedAt, pausedAt: null });
  }
  function pause() {
    var s = load();
    if (s.index < 0) return;
    if (s.pausedAt) {
      var gap = Date.now() - s.pausedAt;
      save({ index: s.index, cueStartedAt: (s.cueStartedAt || 0) + gap, showStartedAt: (s.showStartedAt || 0) + gap, pausedAt: null });
    } else {
      save({ index: s.index, cueStartedAt: s.cueStartedAt, showStartedAt: s.showStartedAt, pausedAt: Date.now() });
    }
  }
  function reset() {
    var s = load();
    if (s.index >= 0 && !confirm("Remettre le spectacle à zéro ?")) return;
    save({ index: -1, cueStartedAt: null, showStartedAt: null, pausedAt: null });
  }

  function render() {
    var s = load();
    var paused = !!s.pausedAt;
    var now = paused ? Math.floor(s.pausedAt / 1000) : Math.floor(Date.now() / 1000);
    var cur = s.index >= 0 ? cues[s.index] : null;
    var next = cues[s.index + 1] || null;
    var cueEl = s.cueStartedAt ? now - Math.floor(s.cueStartedAt / 1000) : 0;
    var showEl = s.showStartedAt ? now - Math.floor(s.showStartedAt / 1000) : 0;
    var rem = cur && cur.durationSec != null ? cur.durationSec - cueEl : null;
    var over = rem !== null && rem < 0;
    var finished = s.index === cues.length - 1;
    var html = '<div class="top' + '"><span><strong>' + esc(raw.name) + '</strong> <span class="badge">HORS LIGNE</span></span><span>Spectacle : <strong id="show">' + fmt(showEl) + '</strong></span></div>';
    html += '<section class="card' + (paused ? " paused" : "") + '"><div class="badge pause-banner">EN PAUSE</div>';
    if (cur) {
      html += '<div class="cue">CUE ' + esc(cur.label) + ' · ' + esc(cur.category) + '</div><h1>' + esc(cur.title) + '</h1>';
      if (cur.notes) html += '<p class="notes">' + esc(cur.notes) + '</p>';
      html += '<div id="timer" class="timer' + (over ? " over" : "") + '">' + (rem !== null ? (over ? "+" + fmt(-rem) : fmt(rem)) : fmt(cueEl)) + '</div>';
      html += '<div id="timerlabel" class="small">' + (rem !== null ? (over ? "dépassement" : "restant sur " + fmt(cur.durationSec)) : "écoulé") + '</div>';
    } else {
      html += '<div class="small">Prêt</div><h1>En attente du premier GO</h1>';
    }
    html += '</section><div class="row">' +
      '<button id="back" aria-label="Cue précédente"' + (s.index < 0 || paused ? " disabled" : "") + '>◀</button>' +
      '<button id="go"' + (finished || paused ? " disabled" : "") + '>' + (finished ? "Fin du spectacle" : s.index < 0 ? "GO" : "GO cue suivante") + ' ▶</button>' +
      '<button id="pause" class="' + (paused ? "on" : "") + '" aria-label="' + (paused ? "Reprendre" : "Pause") + '"' + (s.index < 0 ? " disabled" : "") + '>' + (paused ? "▶ Reprendre" : "⏸")+ '</button>' +
      '<button id="reset" aria-label="Remise à zéro">↺</button></div>';
    html += '<p class="small center">Espace ou → : GO · ← : retour · P : pause. Fonctionne sans réseau.</p>';
    if (next) html += '<div class="next"><span class="small">ENSUITE</span><span class="n">' + esc(next.label) + '</span><span style="flex:1">' + esc(next.title) + '</span><span class="small">' + esc(next.category) + '</span></div>';
    html += '<ol>' + cues.map(function (c, i) {
      return '<li class="' + (i === s.index ? "cur" : i < s.index ? "done" : "") + '"><span class="n">' + esc(c.label) + '</span><span class="t">' + esc(c.title) + '</span><span class="c">' + esc(c.category) + '</span></li>';
    }).join("") + '</ol>';
    html += '<p class="small center"><button id="clear" style="padding:6px 10px;font-size:.8rem">Effacer les données de cet appareil</button> Enregistré le ' + esc(new Date(raw.savedAt).toLocaleString("fr-FR")) + '</p>';
    app.innerHTML = html;
    document.getElementById("go").onclick = go;
    document.getElementById("back").onclick = back;
    document.getElementById("pause").onclick = pause;
    document.getElementById("reset").onclick = reset;
    document.getElementById("clear").onclick = function () {
      if (confirm("Effacer la conduite enregistrée sur cet appareil ?")) { try { localStorage.removeItem(DATA_KEY); localStorage.removeItem(STATE_KEY); } catch (e) {} location.reload(); }
    };
  }

  function tick() {
    var s = load();
    var now = s.pausedAt ? Math.floor(s.pausedAt / 1000) : Math.floor(Date.now() / 1000);
    var cur = s.index >= 0 ? cues[s.index] : null;
    var cueEl = s.cueStartedAt ? now - Math.floor(s.cueStartedAt / 1000) : 0;
    var showEl = s.showStartedAt ? now - Math.floor(s.showStartedAt / 1000) : 0;
    var rem = cur && cur.durationSec != null ? cur.durationSec - cueEl : null;
    var over = rem !== null && rem < 0;
    var a = document.getElementById("show"), t = document.getElementById("timer"), l = document.getElementById("timerlabel");
    if (a) a.textContent = fmt(showEl);
    if (t) { t.textContent = rem !== null ? (over ? "+" + fmt(-rem) : fmt(rem)) : fmt(cueEl); t.className = "timer" + (over ? " over" : ""); }
    if (l && cur) l.textContent = rem !== null ? (over ? "dépassement" : "restant sur " + fmt(cur.durationSec)) : "écoulé";
  }

  document.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "BUTTON") return;
    if (e.key === "p" || e.key === "P") { e.preventDefault(); pause(); }
    else if (e.code === "Space" || e.key === "ArrowRight") { e.preventDefault(); go(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  });
  window.addEventListener("storage", render);
  setInterval(tick, 500);
  render();
  // Écran allumé pendant le spectacle.
  try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {}
})();
</script>
</body>
</html>
